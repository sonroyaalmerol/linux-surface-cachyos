name: Build & Release Kernel

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      release:
        description: "Publish to GitHub Releases after build"
        required: false
        type: boolean
        default: true

  # Auto-trigger after a successful sync
  workflow_run:
    workflows: ["Sync & Verify CachyOS + Surface Kernel"]
    types:
      - completed
    branches:
      - master

permissions:
  contents: write

jobs:
  # ==========================================================================
  # Build the kernel inside an Arch Linux container
  # ==========================================================================
  build:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read kernel version
        id: version
        run: |
          cd pkg/arch/kernel-cachyos
          VER=$(grep '^pkgver=' PKGBUILD | cut -d= -f2)
          REL=$(grep '^pkgrel=' PKGBUILD | cut -d= -f2)
          SUFFIX=$(grep '^_pkgsuffix=' PKGBUILD | head -1 | cut -d= -f2)
          echo "version=${VER}-${REL}" >> $GITHUB_OUTPUT
          echo "suffix=${SUFFIX}" >> $GITHUB_OUTPUT
          echo "tag=${VER}-${REL}" >> $GITHUB_OUTPUT

      - name: Restore ccache
        run: |
          mkdir -p /tmp/kernel-ccache
          if [ -d "$RUNNER_TEMP/kernel-ccache" ]; then
            cp -a "$RUNNER_TEMP/kernel-ccache/." /tmp/kernel-ccache/
            echo "Restored ccache from persistent storage"
          else
            echo "No existing ccache — fresh build"
          fi

      - name: Build kernel in Arch container
        run: |
          cd pkg/arch/kernel-cachyos

          echo "Building linux-${{ steps.version.outputs.suffix }} ${{ steps.version.outputs.version }}..."

          docker run --rm \
            --volume "$(pwd):/build:rw" \
            --volume "/tmp/kernel-ccache:/ccache:rw" \
            --env CCACHE_DIR=/ccache \
            --env CCACHE_MAXSIZE=5G \
            --env MAKEFLAGS="-j$(nproc)" \
            archlinux:latest \
            bash -euo pipefail -c '
              echo "=== Installing build dependencies ==="
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed base-devel bc binutils cpio gettext \
                libelf openssl pahole perl python rust rust-bindgen rust-src \
                tar xxhash xz zlib zstd ccache git pacman-contrib

              echo "=== Configuring ccache ==="
              export CCACHE_DIR=/ccache
              export CCACHE_MAXSIZE=5G
              ccache -z

              echo "=== Creating build user ==="
              useradd -m -G wheel builduser
              echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
              chown -R builduser: /build

              echo "=== Validating source checksums ==="
              cd /build
              # Checksums are maintained by sync script; validate them here
              sudo -u builduser makepkg --verifysource 2>&1 || {
                echo "Checksum verification failed, regenerating..."
                pacman -S --noconfirm pacman-contrib
                updpkgsums
              }

              echo "=== Building kernel ==="
              sudo -u builduser makepkg -sf --noconfirm 2>&1 | tee /tmp/build.log
              echo "=== Build complete ==="
              ls -la *.pkg.tar.zst

              echo "=== ccache stats ==="
              ccache -s

              # Show any errors from the build
              echo "=== Build errors (if any) ==="
              grep -E "error:|Error |FAILED" /tmp/build.log | grep -v "optional\|secret key\|command failed" | head -20 || true
            '

      - name: Verify packages exist
        id: packages
        run: |
          cd pkg/arch/kernel-cachyos
          PKGS=$(find . -maxdepth 1 -name "*.pkg.tar.zst" | sort)
          echo "Found packages:"
          echo "$PKGS"

          KERNEL=$(echo "$PKGS" | grep -v headers || true)
          HEADERS=$(echo "$PKGS" | grep headers || true)

          if [ -z "$KERNEL" ]; then
            echo "ERROR: Kernel package not found!"
            exit 1
          fi

          echo "kernel_pkg=$(basename $KERNEL)" >> $GITHUB_OUTPUT
          echo "headers_pkg=$(basename $HEADERS)" >> $GITHUB_OUTPUT

      - name: Generate checksums
        run: |
          cd pkg/arch/kernel-cachyos
          echo "## Package Checksums" > ../CHECKSUMS.txt
          echo "" >> ../CHECKSUMS.txt
          echo "Built from commit: ${{ github.sha }}" >> ../CHECKSUMS.txt
          echo "Kernel version: ${{ steps.version.outputs.version }}" >> ../CHECKSUMS.txt
          echo "" >> ../CHECKSUMS.txt
          for f in *.pkg.tar.zst; do
            sha256sum "$f" >> ../CHECKSUMS.txt
          done
          cat ../CHECKSUMS.txt

      - name: Persist ccache
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/kernel-ccache"
          cp -a /tmp/kernel-ccache/. "$RUNNER_TEMP/kernel-ccache/" 2>/dev/null || true
          echo "ccache persisted to $RUNNER_TEMP/kernel-ccache"
          CCACHE_DIR=/tmp/kernel-ccache ccache -s 2>/dev/null || true

      - name: Upload packages as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-packages
          path: |
            pkg/arch/kernel-cachyos/*.pkg.tar.zst
            pkg/CHECKSUMS.txt
          retention-days: 90

  # ==========================================================================
  # Publish to GitHub Releases
  # ==========================================================================
  release:
    needs: build
    if: ${{ inputs.release != false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: kernel-packages
          path: packages/

      - name: Determine release tag
        id: version
        run: |
          VER=$(grep '^pkgver=' pkg/arch/kernel-cachyos/PKGBUILD | cut -d= -f2)
          REL=$(grep '^pkgrel=' pkg/arch/kernel-cachyos/PKGBUILD | cut -d= -f2)
          echo "tag=${VER}-${REL}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          REPO="${{ github.repository }}"

          cat > release-notes.md << NOTES
          ## Linux Surface-CachyOS \`${TAG}\`

          Pre-built kernel packages combining CachyOS performance patches with linux-surface device support.

          ### Install

          \`\`\`bash
          # Download packages
          curl -sLO "https://github.com/${REPO}/releases/download/kernel-${TAG}/linux-surface-cachyos-${TAG}-x86_64.pkg.tar.zst"
          curl -sLO "https://github.com/${REPO}/releases/download/kernel-${TAG}/linux-surface-cachyos-headers-${TAG}-x86_64.pkg.tar.zst"

          # Install
          sudo pacman -U *.pkg.tar.zst

          # Reboot
          sudo reboot
          \`\`\`

          ### What's included

          **CachyOS:** BORE scheduler, -O3, 1000Hz, full preempt, THP=madvise, native CPU optimizations
          **Surface:** SAM, IPTS, ITHC, cameras, WiFi (mwifiex+ath10k), type cover, power button, RTC, HID

          Built from commit \`${{ github.sha }}\`
          NOTES

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ steps.version.outputs.tag }}
          name: Linux Surface-CachyOS ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          files: |
            packages/*.pkg.tar.zst
            packages/CHECKSUMS.txt
          draft: false
          prerelease: false
