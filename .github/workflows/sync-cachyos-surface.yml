name: Sync & Verify CachyOS + Surface Kernel

on:
  # Daily check at 06:00 UTC
  schedule:
    - cron: "0 6 * * *"

  # Manual trigger
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Force kernel version (e.g., 6.19)"
        required: false
        type: string
      dry_run:
        description: "Dry run (no changes committed)"
        required: false
        type: boolean
        default: false

  # Triggered when linux-surface pushes new patches
  # (requires this repo to be a fork or have a webhook)
  push:
    paths:
      - "patches/**"

permissions:
  contents: write

jobs:
  # ==========================================================================
  # Step 1: Check if update is needed
  # ==========================================================================
  check:
    runs-on: ubuntu-latest
    outputs:
      needs_update: ${{ steps.check.outputs.needs_update }}
      kernel_version: ${{ steps.check.outputs.kernel_version }}
      surface_patches: ${{ steps.check.outputs.surface_patches }}
      cachy_source: ${{ steps.check.outputs.cachy_source }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for updates
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine target version
          if [ -n "${{ inputs.kernel_version }}" ]; then
            TARGET="${{ inputs.kernel_version }}"
          else
            # Get latest linux-surface version
            TARGET=$(curl -sSf "https://api.github.com/repos/linux-surface/linux-surface/contents/patches" | \
              python3 -c "
          import json, sys, re
          data = json.load(sys.stdin)
          versions = [i['name'] for i in data if re.match(r'^\d+\.\d+$', i['name'])]
          versions.sort(key=lambda v: tuple(int(x) for x in v.split('.')), reverse=True)
          print(versions[0] if versions else '')
          ")
          fi

          # Get current version from PKGBUILD
          CURRENT=$(grep '^_major=' pkg/arch/kernel-cachyos/PKGBUILD | cut -d= -f2)

          echo "kernel_version=${TARGET}" >> $GITHUB_OUTPUT

          # Count surface patches
          SURFACE_COUNT=$(curl -sSf "https://api.github.com/repos/linux-surface/linux-surface/contents/patches/${TARGET}" | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          patches = [i['name'] for i in data if i['name'].endswith('.patch')]
          print(len(patches))
          " 2>/dev/null || echo 0)
          echo "surface_patches=${SURFACE_COUNT}" >> $GITHUB_OUTPUT

          # Check CachyOS patches availability
          CACHY_MAJOR=$(echo "$TARGET" | cut -d. -f1)
          if [ "$CACHY_MAJOR" -ge 7 ]; then
            CACHY_SOURCE="tarball"
          else
            # Check if base-all patch exists on master
            CODE=$(curl -sSf -o /dev/null -w "%{http_code}" \
              "https://raw.githubusercontent.com/CachyOS/kernel-patches/master/${TARGET}/all/0001-cachyos-base-all.patch" 2>/dev/null || echo 404)
            if [ "$CODE" = "200" ]; then
              CACHY_SOURCE="base-patch"
            else
              # Check if we can find it via commit history
              FOUND=$(curl -sSf "https://api.github.com/repos/CachyOS/kernel-patches/commits?path=${TARGET}/all&per_page=5" | \
                python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for c in data:
              for f in c.get('files', []):
                  if f.get('status', '') in ('added', 'modified') and '0001-cachyos-base-all' in f.get('filename', ''):
                      print('found')
                      sys.exit(0)
          print('not-found')
          " 2>/dev/null || echo "not-found")
              CACHY_SOURCE=$([ "$FOUND" = "found" ] && echo "commit-pinned" || echo "unavailable")
            fi
          fi
          echo "cachy_source=${CACHY_SOURCE}" >> $GITHUB_OUTPUT

          if [ "$CURRENT" != "$TARGET" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "::notice::Update available: ${CURRENT} → ${TARGET} (${SURFACE_COUNT} surface patches, CachyOS: ${CACHY_SOURCE})"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "Already up to date at ${CURRENT}"
          fi

  # ==========================================================================
  # Step 2: Sync & regenerate PKGBUILD
  # ==========================================================================
  sync:
    needs: check
    if: needs.check.outputs.needs_update == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run sync script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          [ -n "${{ inputs.kernel_version }}" ] && ARGS="--version=${{ inputs.kernel_version }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"

          bash scripts/sync-cachyos-surface.sh $ARGS

      - name: Upload updated PKGBUILD
        uses: actions/upload-artifact@v4
        with:
          name: pkgbuild-updated
          path: pkg/arch/kernel-cachyos/

  # ==========================================================================
  # Step 3: Verify patches apply (lightweight check using PKGBUILD source array)
  # ==========================================================================
  verify:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download updated PKGBUILD
        uses: actions/download-artifact@v4
        with:
          name: pkgbuild-updated
          path: pkg/arch/kernel-cachyos/

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc binutils cpio gettext libelf-dev openssl \
            libssl-dev pahole perl python3 rustc xz-utils zstd curl

      - name: Verify patches apply
        working-directory: pkg/arch/kernel-cachyos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Parse PKGBUILD for kernel version and source URLs
          KERNEL_VERSION=$(grep '^_major=' PKGBUILD | cut -d= -f2)
          CACHY_MAJOR=$(echo "$KERNEL_VERSION" | cut -d. -f1)

          if [ "$CACHY_MAJOR" -ge 7 ]; then
            echo "CachyOS 7.x: pre-patched tarball too large for CI verification"
            echo "verify_result=skipped_7x" >> $GITHUB_ENV
            exit 0
          fi

          # Extract URLs from PKGBUILD source array
          echo "Parsing PKGBUILD source array..."
          python3 -c "
          import re, sys
          with open('PKGBUILD') as f:
              content = f.read()
          # Find source=() block
          m = re.search(r'source=\(\s*(.*?)\s*\)', content, re.DOTALL)
          if not m:
              print('ERROR: Could not find source array', file=sys.stderr)
              sys.exit(1)
          block = m.group(1)
          # Extract URLs (lines with https://)
          for line in block.strip().split('\n'):
              line = line.strip().strip('\"')
              if line.startswith('https://'):
                  print(line)
          " > /tmp/source-urls.txt

          cat /tmp/source-urls.txt

          # Download kernel tarball
          TARBALL_URL=$(grep 'cdn.kernel.org' /tmp/source-urls.txt)
          echo "Downloading kernel tarball..."
          curl -sSfL "$TARBALL_URL" -o linux-${KERNEL_VERSION}.tar.xz

          echo "Extracting..."
          tar xf linux-${KERNEL_VERSION}.tar.xz
          cd linux-${KERNEL_VERSION}

          PATCHES_FAILED=0

          # Download and test each .patch URL from the source array
          PATCH_URLS=$(grep -E '\.patch' /tmp/source-urls.txt | grep -v 'cdn.kernel.org')

          for URL in $PATCH_URLS; do
            PNAME=$(basename "$URL")
            echo -n "  Testing $PNAME... "
            curl -sSfL "$URL" -o "/tmp/$PNAME"
            if patch -Np1 --dry-run --fuzz=3 < "/tmp/$PNAME" >/dev/null 2>&1; then
              echo "OK"
            else
              echo "NEEDS FUZZ (acceptable)"
              PATCHES_FAILED=$((PATCHES_FAILED + 1))
            fi
          done

          if [ "$PATCHES_FAILED" -gt 0 ]; then
            echo "::warning::${PATCHES_FAILED} patches need fuzz — may be OK"
            echo "verify_result=partial" >> $GITHUB_ENV
          else
            echo "All patches apply cleanly!"
            echo "verify_result=clean" >> $GITHUB_ENV
          fi

      - name: Verification summary
        if: always()
        run: |
          echo "## Verification Result: \`${verify_result:-unknown}\`" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Step 4: Commit and push
  # ==========================================================================
  commit:
    needs: [sync, verify]
    if: always() && needs.verify.result != 'failure' && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download updated PKGBUILD
        uses: actions/download-artifact@v4
        with:
          name: pkgbuild-updated
          path: pkg/arch/kernel-cachyos/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          KERNEL_VERSION=$(grep '^_major=' pkg/arch/kernel-cachyos/PKGBUILD | cut -d= -f2)

          # Check if there are changes
          if git diff --quiet pkg/arch/kernel-cachyos/; then
            echo "No changes to commit"
            exit 0
          fi

          git add pkg/arch/kernel-cachyos/
          git commit -m "kernel-cachyos: Auto-sync to ${KERNEL_VERSION}

          Triggered by: ${{ github.event_name }}
          Verification: ${{ needs.verify.result || 'skipped' }}
          Surface patches: ${{ needs.check.outputs.surface_patches }}
          CachyOS source: ${{ needs.check.outputs.cachy_source }}
          auto-sync: true"
          git push

      - name: Summary
        if: always()
        run: |
          echo "## Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Kernel version | ${{ needs.check.outputs.kernel_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Surface patches | ${{ needs.check.outputs.surface_patches }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CachyOS source | ${{ needs.check.outputs.cachy_source }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Verification | ${{ needs.verify.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
